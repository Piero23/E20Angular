<div class="homepage">
  <app-background-flyers/>
  <div class="homepage-interaction container-fluid z-1">
    <div class="row row-login">
      <div class="col col-login">
        <div class="login-button">
          @if (!auth.isLoggedIn) {
            <button (click)="auth.login()" class="btn">
              Login
            </button>
          } @else {
            <button (click)="auth.logout()" class="btn">Logout</button>
          }
        </div>
      </div>
    </div>
    <div class="row row-logo">
      <div class="col col-logo">
        <app-site-logo/>
      </div>
    </div>
    <div class="row row-search">
      <div class="col col-search">
        <app-search-bar class="sb"/>
      </div>
    </div>
  </div>
  <app-event-cards/>
</div>
