<!-- Search Container -->
<div class="search-container">
  <div class="search-wrapper">
    <div class="search-box">
      <input
        type="text"
        class="search-input form-control"
        placeholder="Cosa stai aspettando? Cerca un evento..."
        [(ngModel)]="searchQuery"
        (input)="onSearchInputChange($event)"
        (keypress)="onKeyPress($event)">
      <i class="fas fa-search search-icon" (click)="onSearchClick()"></i>
      <i *ngIf="searchQuery && isSearchMode"
         class="fas fa-times clear-icon"
         (click)="clearSearch()"
         title="Cancella ricerca"></i>
    </div>
  </div>
</div>

<!-- Loading Spinner -->
<div *ngIf="isLoading" class="loading-container">
  <div class="spinner-border text-primary" role="status">
    <span class="sr-only">Caricamento...</span>
  </div>
  <p class="loading-text">Caricamento eventi...</p>
</div>

<!-- Error Message -->
<div *ngIf="hasError" class="alert alert-danger" role="alert">
  <i class="fas fa-exclamation-triangle"></i>
  {{ errorMessage }}
  <button type="button" class="btn btn-outline-danger btn-sm ms-2" (click)="isSearchMode ? onSearchClick() : loadAllEvents()">
    Riprova
  </button>
</div>

<!-- Search Results Info -->
<div *ngIf="!isLoading && !hasError && isSearchMode && results.length > 0" class="results-info">
  <div class="row align-items-center">
    <div class="col">
      <p class="mb-0">
        <strong>{{ totalElements }}</strong> eventi trovati per "<em>{{ searchQuery }}</em>"
      </p>
    </div>
    <div class="col-auto" *ngIf="totalPages > 1">
      <small class="text-muted">
        Pagina {{ currentPage + 1 }} di {{ totalPages }}
      </small>
    </div>
  </div>
</div>

<!-- Events List -->
<div *ngIf="!isLoading && !hasError && isSearchMode" class="events-container">
  <!-- No Results -->
  <div *ngIf="results.length === 0" class="no-results">
    <div class="text-center py-5">
      <i class="fas fa-calendar-times fa-3x text-muted mb-3"></i>
      <h4 class="text-muted">Nessun evento trovato</h4>
      <p class="text-muted">
        Prova a modificare i termini di ricerca
      </p>
    </div>
  </div>

  <!-- Simple Event Names List -->
  <div *ngIf="results.length > 0" class="event-names-list">
    <div *ngFor="let evento of results" class="event-name-item">
      <div class="d-flex justify-content-between align-items-center p-3 border rounded mb-2">
        <div>
          <h5 class="mb-1">{{ evento.nome }}</h5>
          <small class="text-muted">{{ formatDate(evento.data) }}</small>
        </div>
        <button class="btn btn-outline-primary btn-sm"> <!--(click)="viewEventDetails(evento)">-->
          <i class="fas fa-eye"></i>
          Dettagli
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Pagination -->
<nav *ngIf="!isLoading && !hasError && isSearchMode && totalPages > 1" aria-label="Paginazione eventi" class="mt-4">
  <ul class="pagination justify-content-center">
    <!-- Previous Button -->
    <li class="page-item" [class.disabled]="currentPage === 0">
      <button class="page-link" (click)="goToPreviousPage()" [disabled]="currentPage === 0">
        <i class="fas fa-chevron-left"></i>
        <span class="sr-only">Precedente</span>
      </button>
    </li>

    <!-- First Page -->
    <li *ngIf="currentPage > 2" class="page-item">
      <button class="page-link" (click)="goToPage(0)">1</button>
    </li>
    <li *ngIf="currentPage > 3" class="page-item disabled">
      <span class="page-link">...</span>
    </li>

    <!-- Page Numbers -->
    <li *ngFor="let pageNum of getPaginationArray()"
        class="page-item"
        [class.active]="pageNum === currentPage">
      <button class="page-link" (click)="goToPage(pageNum)">
        {{ pageNum + 1 }}
      </button>
    </li>

    <!-- Last Page -->
    <li *ngIf="currentPage < totalPages - 4" class="page-item disabled">
      <span class="page-link">...</span>
    </li>
    <li *ngIf="currentPage < totalPages - 3" class="page-item">
      <button class="page-link" (click)="goToPage(totalPages - 1)">{{ totalPages }}</button>
    </li>

    <!-- Next Button -->
    <li class="page-item" [class.disabled]="currentPage === totalPages - 1">
      <button class="page-link" (click)="goToNextPage()" [disabled]="currentPage === totalPages - 1">
        <i class="fas fa-chevron-right"></i>
        <span class="sr-only">Successivo</span>
      </button>
    </li>
  </ul>
</nav>
