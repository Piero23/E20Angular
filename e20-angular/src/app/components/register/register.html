<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
    <h3 class="text-center mb-4">Crea un account</h3>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <!-- Username -->
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" formControlName="username" placeholder="Inserisci il tuo username" />
        <div class="text-danger mt-1" *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">
          Username obbligatorio (min 3 caratteri)
        </div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" formControlName="password" placeholder="Inserisci la password" />
        <div class="text-danger mt-1" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          Password obbligatoria (min 6 caratteri)
        </div>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email" placeholder="nome@esempio.com" />
        <div class="text-danger mt-1" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          Email non valida
        </div>
      </div>

      <!-- Date of Birth -->
      <div class="mb-4">
        <label class="form-label">Data di nascita</label>
        <input type="date" class="form-control" formControlName="dataNascita" />
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary w-100" [disabled]="isSubmitting">
        Registrati
      </button>

      <!-- Error Message -->
      <div class="alert alert-danger mt-3" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
    </form>
  </div>
</div>
